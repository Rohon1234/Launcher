name: Build XOSLauncher

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create XOSLauncher project
        shell: bash
        run: |
          set -e

          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/xoslauncher
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p .github/workflows

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "XOSLauncher"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.xoslauncher"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.xoslauncher"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity-ktx:1.10.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
              <color name="blue">#1677FF</color>
              <color name="dark_panel">#DD202020</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.XOSLauncher" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>

              <application
                  android:theme="@style/Theme.XOSLauncher"
                  android:label="XOSLauncher"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/xoslauncher/MainActivity.kt <<'EOF'
          package com.xoslauncher

          import android.app.*
          import android.content.*
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.*
          import android.widget.*
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import kotlin.math.abs

          class MainActivity : ComponentActivity() {

              private lateinit var root: FrameLayout
              private lateinit var home: LinearLayout
              private var editMode = false
              private val selected = mutableSetOf<String>()
              private var gestureStartDistance = 0f

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  showHome()
              }

              private fun dp(v: Int): Int =
                  (v * resources.displayMetrics.density).toInt()

              private fun text(
                  value: String,
                  size: Float,
                  color: Int = Color.WHITE
              ): TextView {
                  return TextView(this).apply {
                      text = value
                      textSize = size
                      setTextColor(color)
                      gravity = Gravity.CENTER
                  }
              }

              private fun showHome() {
                  editMode = false
                  selected.clear()

                  root = FrameLayout(this)
                  root.setBackgroundColor(Color.BLACK)

                  home = LinearLayout(this)
                  home.orientation = LinearLayout.VERTICAL
                  home.setPadding(dp(20), dp(20), dp(20), 0)

                  val wallpaper = ImageView(this)
                  wallpaper.setBackgroundColor(Color.BLACK)
                  wallpaper.scaleType = ImageView.ScaleType.CENTER_CROP

                  root.addView(
                      wallpaper,
                      FrameLayout.LayoutParams(
                          -1,
                          -1
                      )
                  )

                  root.addView(
                      home,
                      FrameLayout.LayoutParams(
                          -1,
                          -1
                      )
                  )

                  createClockWidget()
                  createHomeApps()
                  createSearchBar()

                  root.setOnTouchListener { _, event ->
                      handlePinch(event)
                  }

                  setContentView(root)
              }

              private fun createClockWidget() {
                  val panel = LinearLayout(this)
                  panel.orientation = LinearLayout.HORIZONTAL
                  panel.gravity = Gravity.CENTER_VERTICAL
                  panel.setPadding(dp(20), dp(20), dp(20), dp(20))

                  val clock = text(
                      String.format(
                          "%02d:%02d",
                          java.util.Calendar.getInstance()
                              .get(java.util.Calendar.HOUR_OF_DAY),
                          java.util.Calendar.getInstance()
                              .get(java.util.Calendar.MINUTE)
                      ),
                      52f
                  )

                  panel.addView(
                      clock,
                      LinearLayout.LayoutParams(
                          0,
                          dp(120),
                          1f
                      )
                  )

                  val date = text("Tue, Nov 10\n26° ☾", 20f)
                  date.gravity = Gravity.CENTER
                  panel.addView(
                      date,
                      LinearLayout.LayoutParams(
                          0,
                          dp(120),
                          1f
                      )
                  )

                  home.addView(
                      panel,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(170)
                      )
                  )
              }

              private fun createHomeApps() {
                  val apps = getLaunchableApps().take(8)

                  val grid = GridLayout(this)
                  grid.columnCount = 4

                  for (app in apps) {
                      val item = LinearLayout(this)
                      item.orientation = LinearLayout.VERTICAL
                      item.gravity = Gravity.CENTER

                      val icon = ImageView(this)
                      icon.setImageDrawable(app.icon)
                      icon.scaleType = ImageView.ScaleType.CENTER_INSIDE

                      item.addView(
                          icon,
                          LinearLayout.LayoutParams(
                              dp(64),
                              dp(64)
                          )
                      )

                      val name = text(
                          app.label,
                          13f
                      )

                      item.addView(
                          name,
                          LinearLayout.LayoutParams(
                              dp(82),
                              dp(38)
                          )
                      )

                      item.setOnClickListener {
                          launch(app.packageName)
                      }

                      grid.addView(
                          item,
                          GridLayout.LayoutParams().apply {
                              width = 0
                              height = dp(110)
                              columnSpec =
                                  GridLayout.spec(
                                      GridLayout.UNDEFINED,
                                      1f
                                  )
                          }
                      )
                  }

                  home.addView(
                      grid,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(230)
                      )
                  )
              }

              private fun createSearchBar() {
                  val search = text(
                      "🔎   Search",
                      17f,
                      Color.LTGRAY
                  )

                  search.setBackgroundColor(Color.rgb(45,45,45))

                  search.setOnClickListener {
                      showAppDrawer()
                  }

                  home.addView(
                      search,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(58)
                      ).apply {
                          topMargin = dp(20)
                          bottomMargin = dp(30)
                      }
                  )
              }

              private fun handlePinch(event: MotionEvent): Boolean {
                  when (event.actionMasked) {
                      MotionEvent.ACTION_POINTER_DOWN -> {
                          if (event.pointerCount >= 2) {
                              gestureStartDistance = distance(event)
                          }
                      }

                      MotionEvent.ACTION_MOVE -> {
                          if (
                              event.pointerCount >= 2 &&
                              gestureStartDistance > 0
                          ) {
                              val current = distance(event)

                              if (
                                  current < gestureStartDistance * 0.65f &&
                                  !editMode
                              ) {
                                  showEditMode()
                                  gestureStartDistance = 0f
                              }
                          }
                      }

                      MotionEvent.ACTION_UP,
                      MotionEvent.ACTION_CANCEL -> {
                          gestureStartDistance = 0f
                      }
                  }

                  return true
              }

              private fun distance(e: MotionEvent): Float {
                  val dx = e.getX(0) - e.getX(1)
                  val dy = e.getY(0) - e.getY(1)
                  return kotlin.math.sqrt(dx * dx + dy * dy)
              }

              private fun showEditMode() {
                  editMode = true
                  home.removeAllViews()

                  createClockWidget()
                  createHomeApps()

                  val spacer = Space(this)
                  home.addView(
                      spacer,
                      LinearLayout.LayoutParams(
                          -1,
                          0,
                          1f
                      )
                  )

                  val bottom = LinearLayout(this)
                  bottom.orientation = LinearLayout.HORIZONTAL
                  bottom.gravity = Gravity.CENTER

                  addEditOption(
                      bottom,
                      "▧",
                      "Wallpapers"
                  ) {
                      showWallpapers()
                  }

                  addEditOption(
                      bottom,
                      "▦",
                      "Widgets"
                  ) {
                      Toast.makeText(
                          this,
                          "Widgets",
                          Toast.LENGTH_SHORT
                      ).show()
                  }

                  addEditOption(
                      bottom,
                      "◉",
                      "Icon Style"
                  ) {
                      Toast.makeText(
                          this,
                          "Icon Style",
                          Toast.LENGTH_SHORT
                      ).show()
                  }

                  addEditOption(
                      bottom,
                      "⚙",
                      "Settings"
                  ) {
                      showHomeScreenMode()
                  }

                  home.addView(
                      bottom,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(150)
                      )
                  )
              }

              private fun addEditOption(
                  parent: LinearLayout,
                  icon: String,
                  title: String,
                  action: () -> Unit
              ) {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.gravity = Gravity.CENTER

                  val i = text(icon, 28f)
                  i.setBackgroundColor(Color.rgb(45,45,45))

                  box.addView(
                      i,
                      LinearLayout.LayoutParams(
                          dp(68),
                          dp(68)
                      )
                  )

                  box.addView(
                      text(title, 14f),
                      LinearLayout.LayoutParams(
                          dp(100),
                          dp(40)
                      )
                  )

                  box.setOnClickListener {
                      action()
                  }

                  parent.addView(
                      box,
                      LinearLayout.LayoutParams(
                          0,
                          -1,
                          1f
                      )
                  )
              }

              private fun showWallpapers() {
                  val page = basePage("Wallpapers")

                  val cards = LinearLayout(this)
                  cards.orientation = LinearLayout.HORIZONTAL
                  cards.setPadding(dp(16), dp(15), dp(16), dp(15))

                  addWallpaperCard(
                      cards,
                      "Gallery",
                      Color.rgb(255,180,45)
                  ) {
                      galleryLauncher.launch(
                          arrayOf("image/*")
                      )
                  }

                  addWallpaperCard(
                      cards,
                      "Static Wallpapers",
                      Color.rgb(100,130,230)
                  ) {
                      showStaticWallpapers()
                  }

                  page.addView(
                      cards,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(180)
                      )
                  )

                  val staticRow = text(
                      "Static Wallpapers   19   ›",
                      20f,
                      Color.BLACK
                  )

                  staticRow.gravity = Gravity.CENTER_VERTICAL
                  staticRow.setPadding(
                      dp(20),
                      0,
                      dp(10),
                      0
                  )

                  staticRow.setOnClickListener {
                      showStaticWallpapers()
                  }

                  page.addView(
                      staticRow,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(65)
                      )
                  )

                  setContentView(page)
              }

              private fun addWallpaperCard(
                  parent: LinearLayout,
                  title: String,
                  color: Int,
                  action: () -> Unit
              ) {
                  val card = text(
                      title,
                      18f,
                      Color.WHITE
                  )

                  card.gravity = Gravity.CENTER
                  card.setBackgroundColor(color)
                  card.setOnClickListener {
                      action()
                  }

                  parent.addView(
                      card,
                      LinearLayout.LayoutParams(
                          0,
                          dp(150),
                          1f
                      ).apply {
                          marginEnd = dp(8)
                      }
                  )
              }

              private val galleryLauncher =
                  registerForActivityResult(
                      ActivityResultContracts.GetContent()
                  ) { uri: Uri? ->
                      if (uri != null) {
                          setWallpaperFromUri(uri)
                      }
                  }

              private fun setWallpaperFromUri(uri: Uri) {
                  try {
                      val input = contentResolver.openInputStream(uri)
                      val bitmap =
                          android.graphics.BitmapFactory
                              .decodeStream(input)

                      val wm =
                          android.app.WallpaperManager
                              .getInstance(this)

                      wm.setBitmap(bitmap)

                      Toast.makeText(
                          this,
                          "Wallpaper applied",
                          Toast.LENGTH_SHORT
                      ).show()

                      showHome()
                  } catch (e: Exception) {
                      Toast.makeText(
                          this,
                          "Could not apply wallpaper",
                          Toast.LENGTH_SHORT
                      ).show()
                  }
              }

              private fun showStaticWallpapers() {
                  val page = basePage("My Wallpaper")

                  val title = text(
                      "Internal Wallpaper",
                      20f,
                      Color.BLACK
                  )

                  title.gravity = Gravity.START
                  title.setPadding(
                      dp(20),
                      dp(15),
                      0,
                      dp(15)
                  )

                  page.addView(title)

                  val grid = GridLayout(this)
                  grid.columnCount = 3
                  grid.setPadding(
                      dp(15),
                      0,
                      dp(15),
                      dp(20)
                  )

                  val wallpapers = listOf(
                      Color.rgb(145,120,230),
                      Color.rgb(145,230,90),
                      Color.rgb(190,180,190),
                      Color.rgb(20,20,20),
                      Color.rgb(180,150,230),
                      Color.rgb(100,160,240),
                      Color.rgb(190,220,180),
                      Color.rgb(170,150,220),
                      Color.rgb(100,180,220)
                  )

                  wallpapers.forEach { color ->
                      val w = View(this)
                      w.setBackgroundColor(color)

                      w.setOnClickListener {
                          applyColorWallpaper(color)
                      }

                      grid.addView(
                          w,
                          GridLayout.LayoutParams().apply {
                              width = 0
                              height = dp(230)
                              columnSpec =
                                  GridLayout.spec(
                                      GridLayout.UNDEFINED,
                                      1f
                                  )
                              setMargins(
                                  dp(5),
                                  dp(5),
                                  dp(5),
                                  dp(5)
                              )
                          }
                      )
                  }

                  page.addView(
                      grid,
                      LinearLayout.LayoutParams(
                          -1,
                          0,
                          1f
                      )
                  )

                  setContentView(page)
              }

              private fun applyColorWallpaper(color: Int) {
                  val drawable =
                      android.graphics.drawable.ColorDrawable(
                          color
                      )

                  android.app.WallpaperManager
                      .getInstance(this)
                      .setDrawable(drawable)

                  Toast.makeText(
                      this,
                      "Wallpaper applied",
                      Toast.LENGTH_SHORT
                  ).show()

                  showHome()
              }

              private fun showAppDrawer() {
                  val page = FrameLayout(this)
                  page.setBackgroundColor(Color.BLACK)

                  val recycler =
                      RecyclerView(this)

                  recycler.layoutManager =
                      GridLayoutManager(this, 4)

                  recycler.adapter =
                      AppAdapter(
                          getLaunchableApps()
                      )

                  page.addView(
                      recycler,
                      FrameLayout.LayoutParams(
                          -1,
                          -1
                      ).apply {
                          topMargin = dp(20)
                          bottomMargin = dp(90)
                      }
                  )

                  val search = text(
                      "🔎   Search for apps",
                      17f,
                      Color.LTGRAY
                  )

                  search.setBackgroundColor(
                      Color.rgb(65,65,65)
                  )

                  search.setOnClickListener {
                      showHomeScreenMode()
                  }

                  page.addView(
                      search,
                      FrameLayout.LayoutParams(
                          -1,
                          dp(60),
                          Gravity.BOTTOM
                      ).apply {
                          leftMargin = dp(20)
                          rightMargin = dp(20)
                          bottomMargin = dp(20)
                      }
                  )

                  setContentView(page)
              }

              private fun showHomeScreenMode() {
                  val page = basePage("Home Screen Mode")

                  val modes = LinearLayout(this)
                  modes.orientation =
                      LinearLayout.HORIZONTAL

                  addMode(
                      modes,
                      "08:45\n\n▦ ▦ ▦\n▦ ▦ ▦",
                      "Classic Mode"
                  )

                  addMode(
                      modes,
                      "08:45\n\n▦ ▦ ▦ ▦\n▦ ▦ ▦ ▦\n▦ ▦ ▦ ▦",
                      "A-Z Mode"
                  )

                  page.addView(
                      modes,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(390)
                      )
                  )

                  addSetting(
                      page,
                      "A-Z Screen Orientation",
                      "Vertical"
                  ) {
                      showOrientationDialog()
                  }

                  addSwitchSetting(
                      page,
                      "Add Newly Installed Apps to\nHome Screen",
                      true
                  )

                  addSwitchSetting(
                      page,
                      "App Classification",
                      false
                  )

                  setContentView(page)
              }

              private fun addMode(
                  parent: LinearLayout,
                  preview: String,
                  label: String
              ) {
                  val box =
                      LinearLayout(this)

                  box.orientation =
                      LinearLayout.VERTICAL

                  box.gravity =
                      Gravity.CENTER

                  val p = text(
                      preview,
                      17f,
                      Color.DKGRAY
                  )

                  p.setBackgroundColor(
                      Color.rgb(245,245,245)
                  )

                  box.addView(
                      p,
                      LinearLayout.LayoutParams(
                          dp(220),
                          dp(300)
                      )
                  )

                  box.addView(
                      text(
                          label,
                          18f,
                          Color.BLACK
                      ),
                      LinearLayout.LayoutParams(
                          -1,
                          dp(50)
                      )
                  )

                  parent.addView(
                      box,
                      LinearLayout.LayoutParams(
                          0,
                          -1,
                          1f
                      )
                  )
              }

              private fun addSetting(
                  parent: LinearLayout,
                  title: String,
                  value: String,
                  click: () -> Unit
              ) {
                  val row = LinearLayout(this)
                  row.gravity =
                      Gravity.CENTER_VERTICAL

                  val t = text(
                      title,
                      19f,
                      Color.BLACK
                  )
                  t.gravity = Gravity.START

                  row.addView(
                      t,
                      LinearLayout.LayoutParams(
                          0,
                          dp(75),
                          1f
                      )
                  )

                  val v = text(
                      "$value  ▼",
                      16f,
                      Color.GRAY
                  )

                  row.addView(
                      v,
                      LinearLayout.LayoutParams(
                          dp(130),
                          dp(75)
                      )
                  )

                  row.setOnClickListener {
                      click()
                  }

                  parent.addView(
                      row,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(75)
                      ).apply {
                          leftMargin = dp(20)
                          rightMargin = dp(20)
                      }
                  )
              }

              private fun showOrientationDialog() {
                  val dialog =
                      Dialog(this)

                  val box =
                      LinearLayout(this)

                  box.orientation =
                      LinearLayout.VERTICAL

                  box.setPadding(
                      dp(25),
                      dp(15),
                      dp(25),
                      dp(15)
                  )

                  val vertical =
                      text(
                          "✓  Vertical",
                          18f,
                          Color.rgb(20,110,230)
                      )

                  val horizontal =
                      text(
                          "Horizontal",
                          18f,
                          Color.BLACK
                      )

                  box.addView(
                      vertical,
                      LinearLayout.LayoutParams(
                          dp(250),
                          dp(65)
                      )
                  )

                  box.addView(
                      horizontal,
                      LinearLayout.LayoutParams(
                          dp(250),
                          dp(65)
                      )
                  )

                  vertical.setOnClickListener {
                      dialog.dismiss()
                  }

                  horizontal.setOnClickListener {
                      dialog.dismiss()
                  }

                  dialog.setContentView(box)
                  dialog.window?.setBackgroundDrawable(
                      android.graphics.drawable.ColorDrawable(
                          Color.WHITE
                      )
                  )

                  dialog.show()
              }

              private fun addSwitchSetting(
                  parent: LinearLayout,
                  title: String,
                  initial: Boolean
              ) {
                  val row =
                      LinearLayout(this)

                  row.gravity =
                      Gravity.CENTER_VERTICAL

                  val t =
                      text(
                          title,
                          19f,
                          Color.BLACK
                      )

                  t.gravity = Gravity.START

                  row.addView(
                      t,
                      LinearLayout.LayoutParams(
                          0,
                          dp(90),
                          1f
                      )
                  )

                  val sw =
                      Switch(this)

                  sw.isChecked =
                      initial

                  row.addView(sw)

                  parent.addView(
                      row,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(90)
                      ).apply {
                          leftMargin = dp(20)
                          rightMargin = dp(20)
                      }
                  )
              }

              private fun basePage(
                  title: String
              ): LinearLayout {
                  val page =
                      LinearLayout(this)

                  page.orientation =
                      LinearLayout.VERTICAL

                  page.setBackgroundColor(
                      Color.WHITE
                  )

                  val top =
                      LinearLayout(this)

                  top.gravity =
                      Gravity.CENTER_VERTICAL

                  val back =
                      text(
                          "‹",
                          42f,
                          Color.BLACK
                      )

                  back.setOnClickListener {
                      showHome()
                  }

                  top.addView(
                      back,
                      LinearLayout.LayoutParams(
                          dp(70),
                          dp(75)
                      )
                  )

                  top.addView(
                      text(
                          title,
                          28f,
                          Color.BLACK
                      ),
                      LinearLayout.LayoutParams(
                          0,
                          dp(75),
                          1f
                      )
                  )

                  page.addView(
                      top,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(80)
                      )
                  )

                  return page
              }

              private fun launch(
                  packageName: String
              ) {
                  try {
                      val intent =
                          packageManager
                              .getLaunchIntentForPackage(
                                  packageName
                              )

                      if (intent != null) {
                          startActivity(intent)
                      }
                  } catch (_: Exception) {
                  }
              }

              private fun getLaunchableApps():
                  List<AppInfo> {

                  val intent =
                      Intent(
                          Intent.ACTION_MAIN,
                          null
                      ).apply {
                          addCategory(
                              Intent.CATEGORY_LAUNCHER
                          )
                      }

                  return packageManager
                      .queryIntentActivities(
                          intent,
                          0
                      )
                      .map {
                          AppInfo(
                              it.activityInfo.packageName,
                              it.loadLabel(
                                  packageManager
                              ).toString(),
                              it.loadIcon(
                                  packageManager
                              )
                          )
                      }
                      .distinctBy {
                          it.packageName
                      }
                      .sortedBy {
                          it.label.lowercase()
                      }
              }

              data class AppInfo(
                  val packageName: String,
                  val label: String,
                  val icon:
                      android.graphics.drawable.Drawable
              )

              inner class AppAdapter(
                  private val apps:
                      List<AppInfo>
              ) :
                  RecyclerView.Adapter<AppAdapter.Holder>() {

                  inner class Holder(
                      val layout:
                          LinearLayout
                  ) :
                      RecyclerView.ViewHolder(
                          layout
                      )

                  override fun onCreateViewHolder(
                      parent: ViewGroup,
                      viewType: Int
                  ): Holder {

                      val layout =
                          LinearLayout(
                              this@MainActivity
                          )

                      layout.orientation =
                          LinearLayout.VERTICAL

                      layout.gravity =
                          Gravity.CENTER

                      layout.setPadding(
                          dp(5),
                          dp(12),
                          dp(5),
                          dp(12)
                      )

                      return Holder(
                          layout
                      )
                  }

                  override fun onBindViewHolder(
                      holder: Holder,
                      position: Int
                  ) {
                      holder.layout
                          .removeAllViews()

                      val app =
                          apps[position]

                      val icon =
                          ImageView(
                              this@MainActivity
                          )

                      icon.setImageDrawable(
                          app.icon
                      )

                      holder.layout.addView(
                          icon,
                          LinearLayout.LayoutParams(
                              dp(68),
                              dp(68)
                          )
                      )

                      holder.layout.addView(
                          text(
                              app.label,
                              13f
                          ),
                          LinearLayout.LayoutParams(
                              -1,
                              dp(35)
                          )
                      )

                      holder.layout.setOnClickListener {
                          launch(
                              app.packageName
                          )
                      }
                  }

                  override fun getItemCount():
                      Int =
                      apps.size
              }
          }
          EOF

          if ! command -v gradle >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gradle
          fi

          gradle wrapper --gradle-version 8.11.1

      - name: Build XOSLauncher APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload XOSLauncher APK
        uses: actions/upload-artifact@v4
        with:
          name: XOSLauncher-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
