name: Build XOSLauncher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build XOSLauncher APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf app
          rm -f build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/xoslauncher
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p .github/workflows

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "XOSLauncher"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.xoslauncher'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.xoslauncher'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildFeatures {
                  viewBinding true
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.activity:activity-ktx:1.10.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
              <color name="blue">#1677FF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="Theme.XOSLauncher"
                  parent="Theme.Material3.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/black</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.QUERY_ALL_PACKAGES" />

              <application
                  android:allowBackup="false"
                  android:label="XOSLauncher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.XOSLauncher">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.HOME" />

                          <category
                              android:name="android.intent.category.DEFAULT" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/xoslauncher/MainActivity.kt <<'EOF'
          package com.xoslauncher

          import android.app.WallpaperManager
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.widget.*
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import kotlin.math.sqrt

          class MainActivity : ComponentActivity() {

              private lateinit var root: FrameLayout
              private var pinchStart = 0f
              private var editMode = false

              private val galleryPicker =
                  registerForActivityResult(
                      ActivityResultContracts.GetContent()
                  ) { uri ->
                      uri?.let {
                          applyWallpaper(it)
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  showHome()
              }

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              private fun makeText(
                  value: String,
                  size: Float,
                  color: Int = Color.WHITE
              ): TextView {

                  return TextView(this).apply {
                      text = value
                      textSize = size
                      setTextColor(color)
                      gravity = Gravity.CENTER
                  }
              }

              private fun showHome() {

                  editMode = false

                  root = FrameLayout(this)
                  root.setBackgroundColor(Color.BLACK)

                  val content =
                      LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(
                              dp(20),
                              dp(35),
                              dp(20),
                              dp(20)
                          )
                      }

                  val wallpaper =
                      ImageView(this).apply {
                          setBackgroundColor(Color.BLACK)
                          scaleType =
                              ImageView.ScaleType.CENTER_CROP
                      }

                  root.addView(
                      wallpaper,
                      FrameLayout.LayoutParams(
                          -1,
                          -1
                      )
                  )

                  root.addView(
                      content,
                      FrameLayout.LayoutParams(
                          -1,
                          -1
                      )
                  )

                  val clock =
                      makeText(
                          "08:45",
                          52f
                      )

                  content.addView(
                      clock,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(120)
                      )
                  )

                  val apps =
                      LinearLayout(this).apply {
                          orientation =
                              LinearLayout.VERTICAL
                      }

                  val launcherApps =
                      getLauncherApps().take(8)

                  for (app in launcherApps) {

                      val item =
                          LinearLayout(this).apply {
                              orientation =
                                  LinearLayout.HORIZONTAL
                              gravity =
                                  Gravity.CENTER_VERTICAL
                              setPadding(
                                  dp(10),
                                  dp(8),
                                  dp(10),
                                  dp(8)
                              )
                          }

                      val icon =
                          ImageView(this).apply {
                              setImageDrawable(
                                  app.loadIcon(
                                      packageManager
                                  )
                              )
                          }

                      item.addView(
                          icon,
                          LinearLayout.LayoutParams(
                              dp(58),
                              dp(58)
                          )
                      )

                      item.addView(
                          makeText(
                              app.loadLabel(
                                  packageManager
                              ).toString(),
                              15f
                          ),
                          LinearLayout.LayoutParams(
                              0,
                              dp(58),
                              1f
                          )
                      )

                      item.setOnClickListener {

                          packageManager
                              .getLaunchIntentForPackage(
                                  app.activityInfo.packageName
                              )
                              ?.let {
                                  startActivity(it)
                              }
                      }

                      apps.addView(item)
                  }

                  content.addView(
                      apps,
                      LinearLayout.LayoutParams(
                          -1,
                          0,
                          1f
                      )
                  )

                  val search =
                      makeText(
                          "⌕   Search",
                          17f,
                          Color.LTGRAY
                      )

                  search.setBackgroundColor(
                      Color.rgb(45,45,45)
                  )

                  search.setOnClickListener {
                      showAppDrawer()
                  }

                  content.addView(
                      search,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(58)
                      )
                  )

                  root.setOnTouchListener {
                      _, event ->
                      detectPinch(event)
                  }

                  setContentView(root)
              }

              private fun detectPinch(
                  event: MotionEvent
              ): Boolean {

                  if (event.pointerCount < 2)
                      return true

                  when (event.actionMasked) {

                      MotionEvent.ACTION_POINTER_DOWN -> {
                          pinchStart =
                              fingerDistance(event)
                      }

                      MotionEvent.ACTION_MOVE -> {

                          val current =
                              fingerDistance(event)

                          if (
                              pinchStart > 0 &&
                              current < pinchStart * 0.65f &&
                              !editMode
                          ) {

                              showEditMode()
                              pinchStart = 0f
                          }
                      }

                      MotionEvent.ACTION_UP,
                      MotionEvent.ACTION_CANCEL -> {
                          pinchStart = 0f
                      }
                  }

                  return true
              }

              private fun fingerDistance(
                  event: MotionEvent
              ): Float {

                  val dx =
                      event.getX(0) -
                              event.getX(1)

                  val dy =
                      event.getY(0) -
                              event.getY(1)

                  return sqrt(
                      dx * dx +
                              dy * dy
                  )
              }

              private fun showEditMode() {

                  editMode = true

                  val content =
                      LinearLayout(this).apply {
                          orientation =
                              LinearLayout.VERTICAL
                          setBackgroundColor(
                              Color.rgb(
                                  15,
                                  15,
                                  15
                              )
                          )
                          setPadding(
                              dp(20),
                              dp(40),
                              dp(20),
                              dp(20)
                          )
                      }

                  content.addView(
                      makeText(
                          "Home Screen",
                          26f
                      ),
                      LinearLayout.LayoutParams(
                          -1,
                          dp(70)
                      )
                  )

                  val spacer =
                      Space(this)

                  content.addView(
                      spacer,
                      LinearLayout.LayoutParams(
                          -1,
                          0,
                          1f
                      )
                  )

                  val menu =
                      LinearLayout(this).apply {
                          gravity = Gravity.CENTER
                      }

                  addEditButton(
                      menu,
                      "▧",
                      "Wallpapers"
                  ) {
                      showWallpapers()
                  }

                  addEditButton(
                      menu,
                      "▦",
                      "Widgets"
                  ) {
                      Toast.makeText(
                          this,
                          "Widgets",
                          Toast.LENGTH_SHORT
                      ).show()
                  }

                  addEditButton(
                      menu,
                      "◉",
                      "Icon Style"
                  ) {
                      Toast.makeText(
                          this,
                          "Icon Style",
                          Toast.LENGTH_SHORT
                      ).show()
                  }

                  addEditButton(
                      menu,
                      "⚙",
                      "Settings"
                  ) {
                      showHomeScreenMode()
                  }

                  content.addView(
                      menu,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(130)
                      )
                  )

                  setContentView(content)
              }

              private fun addEditButton(
                  parent: LinearLayout,
                  icon: String,
                  title: String,
                  action: () -> Unit
              ) {

                  val box =
                      LinearLayout(this).apply {
                          orientation =
                              LinearLayout.VERTICAL
                          gravity =
                              Gravity.CENTER
                          setOnClickListener {
                              action()
                          }
                      }

                  box.addView(
                      makeText(
                          icon,
                          28f
                      ),
                      LinearLayout.LayoutParams(
                          dp(65),
                          dp(65)
                      )
                  )

                  box.addView(
                      makeText(
                          title,
                          13f
                      ),
                      LinearLayout.LayoutParams(
                          dp(100),
                          dp(35)
                      )
                  )

                  parent.addView(
                      box,
                      LinearLayout.LayoutParams(
                          0,
                          -1,
                          1f
                      )
                  )
              }

              private fun showWallpapers() {

                  val page =
                      settingsPage("Wallpapers")

                  val cards =
                      LinearLayout(this).apply {
                          orientation =
                              LinearLayout.HORIZONTAL
                          setPadding(
                              dp(15),
                              dp(15),
                              dp(15),
                              dp(15)
                          )
                      }

                  wallpaperCard(
                      cards,
                      "Gallery"
                  ) {
                      galleryPicker.launch(
                          "image/*"
                      )
                  }

                  wallpaperCard(
                      cards,
                      "Static Wallpapers"
                  ) {
                      showStaticWallpapers()
                  }

                  page.addView(
                      cards,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(180)
                      )
                  )

                  val static =
                      makeText(
                          "Static Wallpapers   19   ›",
                          19f,
                          Color.BLACK
                      )

                  static.gravity =
                      Gravity.CENTER_VERTICAL

                  static.setPadding(
                      dp(20),
                      0,
                      0,
                      0
                  )

                  static.setOnClickListener {
                      showStaticWallpapers()
                  }

                  page.addView(
                      static,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(70)
                      )
                  )

                  setContentView(page)
              }

              private fun wallpaperCard(
                  parent: LinearLayout,
                  title: String,
                  action: () -> Unit
              ) {

                  val card =
                      makeText(
                          title,
                          18f,
                          Color.WHITE
                      )

                  card.setBackgroundColor(
                      Color.rgb(70,70,70)
                  )

                  card.setOnClickListener {
                      action()
                  }

                  parent.addView(
                      card,
                      LinearLayout.LayoutParams(
                          0,
                          dp(150),
                          1f
                      ).apply {
                          marginEnd =
                              dp(8)
                      }
                  )
              }

              private fun showStaticWallpapers() {

                  val page =
                      settingsPage(
                          "My Wallpaper"
                      )

                  page.addView(
                      makeText(
                          "Internal Wallpaper",
                          20f,
                          Color.BLACK
                      ),
                      LinearLayout.LayoutParams(
                          -1,
                          dp(65)
                      ).apply {
                          leftMargin =
                              dp(20)
                      }
                  )

                  val grid =
                      RecyclerView(this)

                  grid.layoutManager =
                      GridLayoutManager(
                          this,
                          3
                      )

                  val colors =
                      listOf(
                          "#7356A6",
                          "#6FAE6C",
                          "#B5B0A7",
                          "#111111",
                          "#8E6FC4",
                          "#4B8CCF",
                          "#91A87D",
                          "#7D65A8",
                          "#6B9FD1"
                      )

                  grid.adapter =
                      ColorWallpaperAdapter(
                          colors
                      )

                  page.addView(
                      grid,
                      LinearLayout.LayoutParams(
                          -1,
                          0,
                          1f
                      )
                  )

                  setContentView(page)
              }

              private fun applyWallpaper(
                  uri: Uri
              ) {

                  try {

                      val bitmap =
                          android.graphics.BitmapFactory
                              .decodeStream(
                                  contentResolver
                                      .openInputStream(uri)
                              )

                      WallpaperManager
                          .getInstance(this)
                          .setBitmap(bitmap)

                      showHome()

                  } catch (e: Exception) {

                      Toast.makeText(
                          this,
                          "Wallpaper failed",
                          Toast.LENGTH_SHORT
                      ).show()
                  }
              }

              private fun showAppDrawer() {

                  val root =
                      FrameLayout(this)

                  root.setBackgroundColor(
                      Color.BLACK
                  )

                  val list =
                      RecyclerView(this)

                  list.layoutManager =
                      GridLayoutManager(
                          this,
                          4
                      )

                  list.adapter =
                      AppAdapter(
                          getLauncherApps()
                      )

                  root.addView(
                      list,
                      FrameLayout.LayoutParams(
                          -1,
                          -1
                      ).apply {
                          bottomMargin =
                              dp(90)
                      }
                  )

                  val search =
                      makeText(
                          "⌕   Search for apps",
                          17f,
                          Color.LTGRAY
                      )

                  search.setBackgroundColor(
                      Color.rgb(
                          55,
                          55,
                          55
                      )
                  )

                  search.setOnClickListener {
                      showHomeScreenMode()
                  }

                  root.addView(
                      search,
                      FrameLayout.LayoutParams(
                          -1,
                          dp(58),
                          Gravity.BOTTOM
                      ).apply {
                          leftMargin =
                              dp(15)
                          rightMargin =
                              dp(15)
                          bottomMargin =
                              dp(15)
                      }
                  )

                  setContentView(root)
              }

              private fun showHomeScreenMode() {

                  val page =
                      settingsPage(
                          "Home Screen Mode"
                      )

                  val modes =
                      LinearLayout(this).apply {
                          orientation =
                              LinearLayout.HORIZONTAL
                      }

                  addMode(
                      modes,
                      "Classic Mode"
                  )

                  addMode(
                      modes,
                      "A-Z Mode"
                  )

                  page.addView(
                      modes,
                      LinearLayout.LayoutParams(
                          -1,
                          dp(300)
                      )
                  )

                  addSetting(
                      page,
                      "A-Z Screen Orientation",
                      "Vertical"
                  ) {
                      showOrientationDialog()
                  }

                  addSwitch(
                      page,
                      "Add Newly Installed Apps to\nHome Screen",
                      true
                  )

                  addSwitch(
                      page,
                      "App Classification",
                      false
                  )

                  setContentView(page)
              }

              private fun addMode(
                  parent: LinearLayout,
                  title: String
              ) {

                  val box =
                      LinearLayout(this).apply {
                          orientation =
                              LinearLayout.VERTICAL
                          gravity =
                              Gravity.CENTER
                      }

                  box.addView(
                      makeText(
                          "08:45\n\n▦ ▦ ▦\n▦ ▦ ▦",
                          16f,
                          Color.DKGRAY
                      ),
                      LinearLayout.LayoutParams(
                          dp(150),
                          dp(220)
                      )
                  )

                  box.addView(
                      makeText(
                          "◉  $title",
                          17f,
                          Color.BLACK
                      ),
                      LinearLayout.LayoutParams(
                          -1,
                          dp(55)
                      )
                  )

                  parent.addView(
                      box,
                      LinearLayout.LayoutParams(
                          0,
                          -1,
                          1f
                      )
                  )
              }

              private fun addSetting(
                  parent: LinearLayout,
                  title: String,
                  value: String,
                  action: () -> Unit
              ) {

                  val row =
                      LinearLayout(this).apply {
                          gravity =
                              Gravity.CENTER_VERTICAL
                          setPadding(
                              dp(20),
                              0,
                              dp(20),
                              0
                          )
                          setOnClickListener {
                              action()
                          }
                      }

                  row.addView(
                      makeText(
                          title,
                          18f,
                          Color.BLACK
                      ),
                      LinearLayout.LayoutParams(
                          0,
                          dp(75),
                          1f
                      )
                  )

                  row.addView(
                      makeText(
                          "$value  ▼",
                          15f,
                          Color.GRAY
                      ),
                      LinearLayout.LayoutParams(
                          dp(130),
                          dp(75)
                      )
                  )

                  parent.addView(row)
              }

              private fun addSwitch(
                  parent: LinearLayout,
                  title: String,
                  checked: Boolean
              ) {

                  val row =
                      LinearLayout(this).apply {
                          gravity =
                              Gravity.CENTER_VERTICAL
                          setPadding(
                              dp(20),
                              0,
                              dp(20),
                              0
                          )
                      }

                  row.addView(
                      makeText(
                          title,
                          18f,
                          Color.BLACK
                      ),
                      LinearLayout.LayoutParams(
                          0,
                          dp(85),
                          1f
                      )
                  )

                  row.addView(
                      Switch(this).apply {
                          isChecked =
                              checked
                      }
                  )

                  parent.addView(row)
              }

              private fun showOrientationDialog() {

                  val dialog =
                      Dialog(this)

                  val layout =
                      LinearLayout(this).apply {
                          orientation =
                              LinearLayout.VERTICAL
                          setPadding(
                              dp(20),
                              dp(10),
                              dp(20),
                              dp(10)
                          )
                      }

                  layout.addView(
                      makeText(
                          "✓  Vertical",
                          18f,
                          Color.BLUE
                      ),
                      LinearLayout.LayoutParams(
                          dp(240),
                          dp(60)
                      )
                  )

                  layout.addView(
                      makeText(
                          "Horizontal",
                          18f,
                          Color.BLACK
                      ),
                      LinearLayout.LayoutParams(
                          dp(240),
                          dp(60)
                      )
                  )

                  dialog.setContentView(
                      layout
                  )

                  dialog.window
                      ?.setBackgroundDrawableResource(
                          android.R.color.white
                      )

                  dialog.show()
              }

              private fun settingsPage(
                  title: String
              ): LinearLayout {

                  val page =
                      LinearLayout(this).apply {
                          orientation =
                              LinearLayout.VERTICAL
                          setBackgroundColor(
                              Color.WHITE
                          )
                      }

                  val top =
                      LinearLayout(this).apply {
                          gravity =
                              Gravity.CENTER_VERTICAL
                      }

                  val back =
                      makeText(
                          "‹",
                          40f,
                          Color.BLACK
                      )

                  back.setOnClickListener {
                      showHome()
                  }

                  top.addView(
                      back,
                      LinearLayout.LayoutParams(
                          dp(65),
                          dp(75)
                      )
                  )

                  top.addView(
                      makeText(
                          title,
                          27f,
                          Color.BLACK
                      ),
                      LinearLayout.LayoutParams(
                          0,
                          dp(75),
                          1f
                      )
                  )

                  page.addView(
                      top
                  )

                  return page
              }

              private fun getLauncherApps():
                  List<android.content.pm.ResolveInfo> {

                  val intent =
                      Intent(
                          Intent.ACTION_MAIN
                      )

                  intent.addCategory(
                      Intent.CATEGORY_LAUNCHER
                  )

                  return packageManager
                      .queryIntentActivities(
                          intent,
                          0
                      )
                      .sortedBy {
                          it.loadLabel(
                              packageManager
                          ).toString()
                              .lowercase()
                      }
              }

              inner class AppAdapter(
                  private val apps:
                      List<android.content.pm.ResolveInfo>
              ) :
                  RecyclerView.Adapter<AppAdapter.VH>() {

                  inner class VH(
                      val view:
                          LinearLayout
                  ) :
                      RecyclerView.ViewHolder(
                          view
                      )

                  override fun onCreateViewHolder(
                      parent: ViewGroup,
                      type: Int
                  ): VH {

                      val layout =
                          LinearLayout(
                              this@MainActivity
                          ).apply {
                              orientation =
                                  LinearLayout.VERTICAL
                              gravity =
                                  Gravity.CENTER
                              setPadding(
                                  dp(5),
                                  dp(12),
                                  dp(5),
                                  dp(12)
                              )
                          }

                      return VH(layout)
                  }

                  override fun onBindViewHolder(
                      holder: VH,
                      position: Int
                  ) {

                      holder.view.removeAllViews()

                      val app =
                          apps[position]

                      val icon =
                          ImageView(
                              this@MainActivity
                          )

                      icon.setImageDrawable(
                          app.loadIcon(
                              packageManager
                          )
                      )

                      holder.view.addView(
                          icon,
                          LinearLayout.LayoutParams(
                              dp(65),
                              dp(65)
                          )
                      )

                      holder.view.addView(
                          makeText(
                              app.loadLabel(
                                  packageManager
                              ).toString(),
                              12f
                          )
                      )

                      holder.view.setOnClickListener {

                          val intent =
                              packageManager
                                  .getLaunchIntentForPackage(
                                      app.activityInfo
                                          .packageName
                                  )

                          intent?.let {
                              startActivity(it)
                          }
                      }
                  }

                  override fun getItemCount() =
                      apps.size
              }

              inner class ColorWallpaperAdapter(
                  private val colors:
                      List<String>
              ) :
                  RecyclerView.Adapter<ColorWallpaperAdapter.VH>() {

                  inner class VH(
                      val view: View
                  ) :
                      RecyclerView.ViewHolder(
                          view
                      )

                  override fun onCreateViewHolder(
                      parent: ViewGroup,
                      type: Int
                  ): VH {

                      val view =
                          View(
                              this@MainActivity
                          )

                      view.layoutParams =
                          RecyclerView.LayoutParams(
                              -1,
                              dp(230)
                          )

                      return VH(view)
                  }

                  override fun onBindViewHolder(
                      holder: VH,
                      position: Int
                  ) {

                      val color =
                          Color.parseColor(
                              colors[position]
                          )

                      holder.view.setBackgroundColor(
                          color
                      )

                      holder.view.setOnClickListener {

                          WallpaperManager
                              .getInstance(
                                  this@MainActivity
                              )
                              .setResource(
                                  android.R.color.black
                              )

                          Toast.makeText(
                              this@MainActivity,
                              "Wallpaper applied",
                              Toast.LENGTH_SHORT
                          ).show()

                          showHome()
                      }
                  }

                  override fun getItemCount() =
                      colors.size
              }
          }
          EOF

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.11.1

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload XOSLauncher APK
        uses: actions/upload-artifact@v4
        with:
          name: XOSLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
